<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Emojis | Pensador Sem Fronteiras</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #0a0c0f 0%, #020304 100%);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            color: #e0f0ff;
            min-height: 100vh;
            padding: 1.5rem 1.2rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            line-height: 1.6;
            -webkit-user-select: none;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.03) 1px, transparent 1px);
            background-size: 26px 26px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 850px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        /* Botões de navegação superiores */
        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            justify-content: center;
            margin-bottom: 0.3rem;
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.72);
            border: 2px solid #ffcc00;
            color: #ffe680;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.85rem 1.8rem;
            border-radius: 45px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            box-shadow: 0 0 22px rgba(255, 204, 0, 0.55), 0 8px 20px rgba(0,0,0,0.7);
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            touch-action: manipulation;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:hover {
            background: #ffcc00;
            color: #000;
            border-color: #ff00ff;
            box-shadow: 0 0 45px #ffcc00, 0 0 75px #ff00ff;
            transform: translateY(-3px);
        }

        .nav-btn:active {
            transform: scale(0.92);
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 60px #fff, 0 0 100px #ffcc00;
            transition: 0.08s;
        }

        .nav-btn.secondary {
            border-color: #ff00ff;
            color: #ffb3ff;
            box-shadow: 0 0 22px rgba(255, 0, 255, 0.55), 0 8px 20px rgba(0,0,0,0.7);
        }

        .nav-btn.secondary:hover {
            background: #ff00ff;
            color: #000;
            border-color: #ffcc00;
            box-shadow: 0 0 45px #ff00ff, 0 0 75px #ffcc00;
        }

        .nav-btn.secondary:active {
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 60px #fff, 0 0 100px #ff00ff;
        }

        /* Título principal */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.4rem, 8vw, 3.8rem);
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 12px #ffcc00,
                0 0 35px #ffcc00,
                0 0 65px #ff8800,
                0 0 100px #ffcc00;
            margin-bottom: 0.3rem;
            filter: drop-shadow(0 0 20px #ff00ff);
            word-break: break-word;
        }

        .emoji-title-icon {
            font-size: 3.5rem;
            display: block;
            filter: drop-shadow(0 0 25px #ffcc00);
            margin-bottom: 0.3rem;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        /* Cartão padrão */
        .card {
            background: rgba(8, 12, 22, 0.8);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 28px;
            padding: 1.4rem 1.3rem;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.25), 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: all 0.25s ease;
            position: relative;
            overflow: visible;
        }

        .card:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 45px #ff00ff80, 0 0 85px #ffcc004d;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            color: #ffcc00;
            text-shadow: 0 0 14px #ffcc00, 0 0 30px #ff8800;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            font-size: 1.6rem;
        }

        p {
            color: #fff5d4;
            text-shadow: 0 0 5px rgba(255,204,0,0.5);
            margin-bottom: 0.5rem;
        }

        a {
            color: #ffb3ff;
            text-decoration: none;
            font-weight: 600;
            text-shadow: 0 0 8px magenta;
            transition: 0.2s;
        }

        a:hover {
            color: #fff;
            text-shadow: 0 0 18px #ffcc00, 0 0 30px #ff00ff;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffcc00, #ff00ff, transparent);
            margin: 1.2rem 0;
            box-shadow: 0 0 20px #ffcc00;
        }

        /* Grid de emojis com cartões individuais */
        .emoji-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.8rem;
        }

        .emoji-item {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 204, 0, 0.45);
            border-radius: 20px;
            padding: 0.9rem 1.1rem;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.7rem;
            box-shadow: 0 0 14px rgba(255, 204, 0, 0.25);
            transition: all 0.25s ease;
        }

        .emoji-item:hover {
            border-color: #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5), 0 0 50px rgba(255, 204, 0, 0.3);
            background: rgba(20, 0, 35, 0.7);
            transform: translateX(4px);
        }

        .emoji-display {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex: 1;
            min-width: 200px;
        }

        .emoji-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 10px #ffcc00);
            min-width: 50px;
            text-align: center;
            animation: pulse-emoji 2s ease-in-out infinite;
        }

        @keyframes pulse-emoji {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .emoji-code {
            color: #ffe680;
            font-size: 0.95rem;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 6px #ffcc00;
            word-break: break-all;
        }

        .emoji-desc {
            color: #b5fffa;
            font-size: 0.9rem;
            text-shadow: 0 0 5px cyan;
            margin-left: 0.3rem;
        }

        /* Botão copiar código do emoji */
        .copy-emoji-btn {
            background: #000;
            border: 2px solid #ffcc00;
            color: #ffe680;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 0.55rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 16px rgba(255, 204, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.25s;
            white-space: nowrap;
            touch-action: manipulation;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .copy-emoji-btn:hover {
            background: #ffcc00;
            color: #000;
            border-color: #ff00ff;
            box-shadow: 0 0 35px #ffcc00, 0 0 55px #ff00ff;
        }

        .copy-emoji-btn:active {
            transform: scale(0.9);
            background: #fff;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 45px #fff;
            transition: 0.08s;
        }

        /* Link para Emojipedia */
        .external-link-card {
            text-align: center;
            padding: 1rem;
        }

        .external-link-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff8800;
            color: #ffcc00;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 0.85rem 2rem;
            border-radius: 45px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 22px rgba(255, 136, 0, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.25s;
            display: inline-block;
            text-decoration: none;
            touch-action: manipulation;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .external-link-btn:hover {
            background: #ff8800;
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 45px #ff8800, 0 0 75px #ffcc00;
            transform: translateY(-3px);
        }

        .external-link-btn:active {
            transform: scale(0.92);
            background: #fff;
            transition: 0.08s;
        }

        /* Rodapé */
        .footer-signature {
            margin-top: 2.5rem;
            text-align: center;
            border-top: 1px dashed #ffcc00;
            padding-top: 2rem;
            width: 100%;
        }

        .footer-signature p {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            letter-spacing: 0.25em;
            color: #aaa;
            text-shadow: 0 0 8px #ff00ff;
        }

        .footer-signature small {
            font-size: 0.85rem;
            color: #ffcc00;
        }

        .footer-signature em {
            font-style: italic;
            color: #ffb3ff;
            text-shadow: 0 0 10px magenta;
            display: block;
            margin-top: 0.3rem;
        }

        @media (max-width: 480px) {
            body { padding: 1rem 0.8rem; }
            .nav-btn { font-size: 0.85rem; padding: 0.7rem 1.3rem; }
            .emoji-icon { font-size: 1.8rem; min-width: 40px; }
            .copy-emoji-btn { font-size: 0.7rem; padding: 0.45rem 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Botões de navegação superiores (COMPLETAMENTE CLICÁVEIS) -->
        <div class="nav-buttons">
            <button class="nav-btn" onclick="navegarPara('../../index.html')">🏠 Voltar Home</button>
            <button class="nav-btn secondary" onclick="navegarPara('../html1.html')">📄 HTML Nível I</button>
        </div>

        <!-- Título principal -->
        <h1 class="main-title">
            <span class="emoji-title-icon">😀</span>
            Emojis
        </h1>

        <!-- Link para Emojipedia -->
        <div class="card external-link-card">
            <p style="margin-bottom: 1rem;">Para mais emojis, visite a página:</p>
            <button class="external-link-btn" onclick="abrirEmojipedia()">🌐 Emojipedia</button>
            <p style="margin-top: 0.6rem; font-size: 0.85rem; color: #888;">
                <a href="https://emojipedia.org/" target="_blank" rel="noopener">ou clique aqui para abrir diretamente</a>
            </p>
        </div>

        <hr>

        <!-- Lista de Emojis com botão copiar individual -->
        <div class="card">
            <h2>📋 Lista de Emojis HTML</h2>
            <div class="emoji-grid" id="emojiList">
                <!-- Os emojis serão gerados dinamicamente para manter a fidelidade e evitar repetição manual -->
            </div>
        </div>

        <!-- Rodapé -->
        <footer class="footer-signature">
            <p><small>&copy; Pensador Sem Fronteiras. Todos os direitos reservados.</small></p>
            <p><em>Do Zero ao Infinito</em></p>
        </footer>
    </div>

    <script>
        (function() {
            // 🌟 FUNÇÃO DE NAVEGAÇÃO REAL COM BOTÕES 🌟
            window.navegarPara = function(url) {
                if (!url || url === '#') return;
                
                const botoes = document.querySelectorAll('.nav-btn, .external-link-btn');
                botoes.forEach(btn => {
                    btn.style.pointerEvents = 'none';
                    btn.style.opacity = '0.7';
                });
                
                setTimeout(() => {
                    window.location.href = url;
                }, 120);
                
                setTimeout(() => {
                    botoes.forEach(btn => {
                        btn.style.pointerEvents = 'auto';
                        btn.style.opacity = '1';
                    });
                }, 600);
            };

            // 🌟 FUNÇÃO PARA ABRIR EMOJIPEDIA 🌟
            window.abrirEmojipedia = function() {
                window.open('https://emojipedia.org/', '_blank', 'noopener,noreferrer');
            };

            // 🌟 LISTA COMPLETA DE EMOJIS (FIEL AO CONTEÚDO ORIGINAL) 🌟
            const emojis = [
                { codigo: '&star;', hex: '&#x2606;', desc: 'Estrela', icon: '☆' },
                { codigo: '&#x1F596;', hex: '&#x1F596;', desc: 'Vulcan salute (pequeno gafanhoto)', icon: '🖖' },
                { codigo: '&#x1F600;', hex: '&#x1F600;', desc: 'Rosto sorridente', icon: '😀' },
                { codigo: '&#x1F601;', hex: '&#x1F601;', desc: 'Rosto sorridente com dentes a mostrar', icon: '😁' },
                { codigo: '&#x1F602;', hex: '&#x1F602;', desc: 'Rosto sorridente com lágrimas de alegria', icon: '😂' },
                { codigo: '&#x1F603;', hex: '&#x1F603;', desc: 'Rosto sorridente com olhos abertos', icon: '😃' },
                { codigo: '&#x1F604;', hex: '&#x1F604;', desc: 'Rosto sorridente com olhos sorridentes', icon: '😄' },
                { codigo: '&#x1F605;', hex: '&#x1F605;', desc: 'Rosto sorridente com suor', icon: '😅' },
                { codigo: '&#x1F606;', hex: '&#x1F606;', desc: 'Rosto sorridente com olhos fechados', icon: '😆' },
                { codigo: '&#x1F607;', hex: '&#x1F607;', desc: 'Rosto sorridente com auréola (anjo)', icon: '😇' },
                { codigo: '&#x1F608;', hex: '&#x1F608;', desc: 'Rosto sorridente com olhos sorridentes', icon: '😈' },
                { codigo: '&#x1F609;', hex: '&#x1F609;', desc: 'Rosto sorridente com piscadela (diabo)', icon: '😉' },
                { codigo: '&#x1F60A;', hex: '&#x1F60A;', desc: 'Rosto sorridente com olhos sorridentes', icon: '😊' },
                { codigo: '&#x1F60B;', hex: '&#x1F60B;', desc: 'Rosto sorridente com língua fora', icon: '😋' },
                { codigo: '&#x1F60C;', hex: '&#x1F60C;', desc: 'Rosto sorridente com olhos fechados', icon: '😌' },
                { codigo: '&#x1F60D;', hex: '&#x1F60D;', desc: 'Rosto sorridente com olhos de coração', icon: '😍' },
                { codigo: '&#x1F60E;', hex: '&#x1F60E;', desc: 'Rosto sorridente com óculos de sol', icon: '😎' },
                { codigo: '&#x1F60F;', hex: '&#x1F60F;', desc: 'Rosto sorridente com olhar malandro', icon: '😏' },
                { codigo: '&#x1F610;', hex: '&#x1F610;', desc: 'Rosto neutro', icon: '😐' },
                { codigo: '&#x1F611;', hex: '&#x1F611;', desc: 'Rosto sério', icon: '😑' },
                { codigo: '&#x1F612;', hex: '&#x1F612;', desc: 'Rosto triste', icon: '😒' },
                { codigo: '&#x1F44D;', hex: '&#x1F44D;', desc: 'Polegar para cima', icon: '👍' },
                { codigo: '&#x1F44E;', hex: '&#x1F44E;', desc: 'Polegar para baixo', icon: '👎' }
            ];

            // Função para copiar código
            function copiarCodigo(codigo, botao) {
                navigator.clipboard.writeText(codigo).then(() => {
                    const originalHTML = botao.innerHTML;
                    botao.innerHTML = '✅ Copiado!';
                    botao.style.background = '#00ffaa';
                    botao.style.color = '#000';
                    botao.style.borderColor = '#fff';
                    
                    setTimeout(() => {
                        botao.innerHTML = originalHTML;
                        botao.style.background = '#000';
                        botao.style.color = '#ffe680';
                        botao.style.borderColor = '#ffcc00';
                    }, 1600);
                }).catch(() => {
                    alert('Falha ao copiar. Tente novamente.');
                });
            }

            // Gerar dinamicamente a lista de emojis
            const emojiListContainer = document.getElementById('emojiList');
            
            emojis.forEach((emoji, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'emoji-item';
                
                const displayDiv = document.createElement('div');
                displayDiv.className = 'emoji-display';
                
                const iconSpan = document.createElement('span');
                iconSpan.className = 'emoji-icon';
                iconSpan.textContent = emoji.icon;
                
                const codeSpan = document.createElement('span');
                codeSpan.className = 'emoji-code';
                codeSpan.innerHTML = `<strong>${emoji.codigo}</strong>`;
                
                const descSpan = document.createElement('span');
                descSpan.className = 'emoji-desc';
                descSpan.textContent = `- ${emoji.desc}`;
                
                displayDiv.appendChild(iconSpan);
                displayDiv.appendChild(codeSpan);
                displayDiv.appendChild(descSpan);
                
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-emoji-btn';
                copyBtn.textContent = '📋 Copiar';
                copyBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    copiarCodigo(emoji.hex, copyBtn);
                });
                
                itemDiv.appendChild(displayDiv);
                itemDiv.appendChild(copyBtn);
                emojiListContainer.appendChild(itemDiv);
            });

            // Suporte para tecla Enter nos botões de navegação (acessibilidade)
            document.querySelectorAll('.nav-btn, .external-link-btn').forEach(btn => {
                btn.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

        })();
    </script>
</body>
</html>
