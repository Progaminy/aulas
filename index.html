    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 20% 10%, #0a0c0f 0%, #020304 100%);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: #e0f0ff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      line-height: 1.5;
      -webkit-user-select: none;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 0, 255, 0.02) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 750px;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 
        0 0 10px #0ff,
        0 0 30px #0ff,
        0 0 60px #f0f,
        0 0 90px #00ffff;
      margin-bottom: 0.25rem;
      filter: drop-shadow(0 0 15px magenta);
      word-break: break-word;
    }

    .sub-header {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 400;
      color: #adf0ff;
      text-shadow: 0 0 8px #00ffff;
      margin-bottom: 1.8rem;
      letter-spacing: 0.1em;
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5rem 1rem;
      border-radius: 40px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 255, 255, 0.4);
      display: inline-block;
      align-self: center;
    }

    /* 🌟🌟🌟 ESTILO EXAGERADO 3D PARA A FOTO (ARREDONDADA, BOMBAR, ANIMAÇÃO) 🌟🌟🌟 */
    .foto-pensador-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0.5rem 0 1rem;
      perspective: 800px;
    }

    .foto-pensador {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #00ffff;
      box-shadow: 
        0 0 25px #00ffff,
        0 0 50px #ff00ff,
        0 0 80px #00ffff,
        0 15px 35px rgba(0, 0, 0, 0.8),
        inset 0 -8px 15px rgba(0,0,0,0.5);
      filter: brightness(1.1) contrast(1.1) saturate(1.2);
      animation: flutuar3D 4s ease-in-out infinite, brilhoPulsante 2.5s ease-in-out infinite;
      transform-style: preserve-3d;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .foto-pensador:hover {
      transform: scale(1.08) rotateY(8deg) rotateX(5deg);
      box-shadow: 
        0 0 40px #ffffff,
        0 0 70px #ff00ff,
        0 0 110px #00ffff,
        0 20px 50px rgba(0,0,0,0.9);
      border-color: #ff00ff;
      animation: flutuar3D 1.5s ease-in-out infinite, brilhoPulsante 1s ease-in-out infinite;
    }

    @keyframes flutuar3D {
      0%, 100% {
        transform: translateY(0px) rotateY(0deg) rotateX(0deg);
      }
      25% {
        transform: translateY(-8px) rotateY(3deg) rotateX(2deg);
      }
      50% {
        transform: translateY(-4px) rotateY(-2deg) rotateX(-1deg);
      }
      75% {
        transform: translateY(-10px) rotateY(2deg) rotateX(3deg);
      }
    }

    @keyframes brilhoPulsante {
      0%, 100% {
        box-shadow: 
          0 0 25px #00ffff,
          0 0 50px #ff00ff,
          0 0 80px #00ffff,
          0 15px 35px rgba(0, 0, 0, 0.8);
      }
      50% {
        box-shadow: 
          0 0 40px #ffffff,
          0 0 75px #ff00ff,
          0 0 120px #00ffff,
          0 15px 35px rgba(0, 0, 0, 0.8);
      }
    }

    @media (max-width: 480px) {
      .foto-pensador {
        width: 110px;
        height: 110px;
      }
    }

    .section-card {
      background: rgba(8, 12, 20, 0.75);
      backdrop-filter: blur(18px);

    .toggle-btn {

      color: #0ff;

      font-weight: 600;

      display: flex;

      gap: 0.3rem;

      touch-action: manipulation;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-btn:hover {
      background: #00ffff;
      color: #000;
      border-color: #ff00ff;
      box-shadow: 0 0 35px #ff00ff, 0 0 65px #00ffff;
    }

    .toggle-btn:active {

    }

    .link-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.5rem;
      transition: all 0.4s ease;

    .hidden-list {

    /* 🌟🌟🌟 BOTÃO DE NAVEGAÇÃO ÚNICO (CLICÁVEL INTEIRO, SEM BOTÃO COPIAR) 🌟🌟🌟 */
    .nav-level-btn {

    .nav-level-btn:active {

      background: #fff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 50px #fff;
      transition: 0.08s;

  <script>
    (function() {
      // 🌟 FUNÇÃO DE NAVEGAÇÃO REAL COM BOTÕES 🌟
      window.navegarPara = function(url) {
        if (!url || url === '#') return;
        
        const botoes = document.querySelectorAll('.nav-level-btn');
        botoes.forEach(btn => {
          btn.style.pointerEvents = 'none';
          btn.style.opacity = '0.7';
        });
        
        setTimeout(() => {
          window.location.href = url;
        }, 100);
        
        setTimeout(() => {
          botoes.forEach(btn => {
            btn.style.pointerEvents = 'auto';
            btn.style.opacity = '1';
          });
        }, 500);
      };

      // Mapeamento dos botões toggle e listas correspondentes
      const sections = [
        { toggleId: 'toggleVsCode', listId: 'listVsCode' },
        { toggleId: 'toggleTermux', listId: 'listTermux' },
        { toggleId: 'toggleTermuxX11', listId: 'listTermuxX11' },
        { toggleId: 'toggleLinux', listId: 'listLinux' },
        { toggleId: 'toggleGitHub', listId: 'listGitHub' },
        { toggleId: 'toggleHtml', listId: 'listHtml' },
        { toggleId: 'toggleCss', listId: 'listCss' },
        { toggleId: 'toggleJs', listId: 'listJs' },
        { toggleId: 'toggleTs', listId: 'listTs' },
        { toggleId: 'toggleFirebase', listId: 'listFirebase' }
      ];

      // Função toggle expandir/recolher
      sections.forEach(({ toggleId, listId }) => {
        const btn = document.getElementById(toggleId);
        const list = document.getElementById(listId);
        if (!btn || !list) return;

        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const isHidden = list.classList.contains('hidden-list');
          if (isHidden) {
            list.classList.remove('hidden-list');
            btn.innerHTML = '📁 Recolher';
          } else {
            list.classList.add('hidden-list');
            btn.innerHTML = '📂 Expandir';
          }
        });
      });

      // Suporte para tecla Enter nos botões
      document.querySelectorAll('.nav-level-btn, .toggle-btn').forEach(btn => {
        btn.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      });

    })();
  </script>
</body>
</html>
