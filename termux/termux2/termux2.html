<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>Termux Lendário II</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 15%, #0b1424, #010314);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem 2.5rem;
            color: #d9f0ff;
            line-height: 1.5;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 85% 20%, rgba(255, 0, 255, 0.08) 0%, transparent 55%),
                        radial-gradient(circle at 10% 80%, rgba(0, 229, 255, 0.09) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 650px;
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        h1 {
            font-size: clamp(2.6rem, 9vw, 4rem);
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #7bf0ff, #f472b6, #bef264);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 28px #ff00d0);
            text-shadow: 0 0 25px #38bdf8, 0 0 50px #d946ef;
            margin-bottom: 0.2rem;
            letter-spacing: -0.5px;
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                filter: drop-shadow(0 0 20px #ff00d0);
            }
            100% {
                filter: drop-shadow(0 0 45px #00e5ff) drop-shadow(0 0 20px #f472b6);
            }
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            justify-content: center;
            width: 100%;
        }

        .btn-link {
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #f472b6;
            border-radius: 3rem;
            padding: 0.9rem 2rem;
            font-weight: 700;
            font-size: 1.15rem;
            text-decoration: none;
            color: #fdf2ff;
            backdrop-filter: blur(14px);
            box-shadow: 0 0 30px #ec4899, 0 10px 22px #000000;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2a1035, #0f1a2e);
            text-shadow: 0 0 10px #f472b6;
            letter-spacing: 0.3px;
        }

        .btn-link:hover, .btn-link:active {
            border-color: #00f2fe;
            box-shadow: 0 0 50px #00e5ff, 0 0 25px #d946ef;
            color: white;
            transform: translateY(-2px);
        }

        .card {
            background: rgba(8, 14, 28, 0.7);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(0, 255, 200, 0.3);
            border-radius: 2.5rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 25px 50px rgba(255, 0, 200, 0.3), 0 0 50px #00ffff38;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #2dd4bf;
            border-radius: 2rem;
            padding: 1.3rem 1.5rem;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.25rem;
            color: #bafff7;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px #14b8a6, 0 10px 20px #00000060;
            transition: all 0.3s;
            background: linear-gradient(135deg, #0d3340, #08192b);
            text-shadow: 0 0 8px #7fffd4;
            letter-spacing: 0.3px;
        }

        .menu-btn:hover, .menu-btn:active {
            border-color: #f472b6;
            box-shadow: 0 0 50px #f43f9e, 0 0 30px #2dd4bf;
            color: #ffffff;
            background: #0b2838;
            transform: scale(1.02);
        }

        .menu-icon {
            font-size: 2.2rem;
            flex-shrink: 0;
            filter: drop-shadow(0 0 12px #00f2fe);
        }

        .menu-text {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .menu-subtitle {
            font-size: 0.8rem;
            font-weight: 400;
            color: #94d8ff;
            text-shadow: 0 0 6px #38bdf8;
            letter-spacing: 0.5px;
        }

        footer {
            margin-top: 1rem;
            text-align: center;
            font-weight: 300;
            font-size: 1rem;
            color: #a5d8ff;
            border-top: 1px dashed #38bdf8;
            padding-top: 1.4rem;
            width: 100%;
        }

        footer small {
            font-weight: 300;
            letter-spacing: 0.5px;
            color: #e0f2fe;
        }

        footer em {
            font-style: italic;
            color: #c084fc;
            text-shadow: 0 0 12px #c026d3;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.4rem 1.1rem;
                border-radius: 2rem;
            }
            .menu-btn {
                padding: 1.1rem 1.2rem;
                font-size: 1.1rem;
                gap: 0.8rem;
            }
            .menu-icon {
                font-size: 1.8rem;
            }
            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Botões de navegação superiores -->
        <div class="nav-buttons">
            <a href="../../index.html" class="btn-link">🏠 Voltar Home</a>
            <a href="termux2.html" class="btn-link">🔄 Refrescar</a>
        </div>

        <!-- Título principal -->
        <h1>⚡Termux Lendário II</h1>

        <!-- Card com os botões de menu -->
        <div class="card">
            <!-- Menu 1: Baixar Vídeo -->
            <a href="paginas/baixarVideo.html" class="menu-btn">
                <span class="menu-icon">🎬</span>
                <span class="menu-text">
                    Baixar Vídeo do YouTube no Termux
                    <span class="menu-subtitle">yt-dlp · formatos · playlists</span>
                </span>
            </a>

            <!-- Menu 2: Baixar Áudio -->
            <a href="paginas/audio.html" class="menu-btn">
                <span class="menu-icon">🎵</span>
                <span class="menu-text">
                    Baixar Áudio do YouTube no Termux
                    <span class="menu-subtitle">MP3 · extração · conversão</span>
                </span>
            </a>

            <!-- Menu 3: Converter Vídeo em Áudio -->
            <a href="paginas/converterVideoAudio.html" class="menu-btn">
                <span class="menu-icon">🔄</span>
                <span class="menu-text">
                    Converter Vídeo em Áudio no Termux
                    <span class="menu-subtitle">ffmpeg · formatos · codecs</span>
                </span>
            </a>
        </div>

        <footer>
            <small>Pensador Sem Fronteiras</small> <br>
            <em>do zero ao infinito</em>
        </footer>
    </div>
</body>
</html>
