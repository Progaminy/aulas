    <h1>Corporar CSS</h1>

    <h2>In Line</h2>

    <p>pode incorporar css em cada linha colocando dendro da tag iniciando com a palavra <strong>style=""</strong></p>

    <code>&lt;p style="color: red;&gt; <code style="color: red;">texto em vermelho</code> &lt;/&gt;"</code>
