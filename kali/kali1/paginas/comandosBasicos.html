<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover, minimal-ui">
  <title>Kali Linux · Comandos Básicos | Pensador Sem Fronteiras</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c0f;
      font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      color: #e0f0ff;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* Navegação - botões grandes, 100% clicáveis */
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      background: rgba(12, 20, 28, 0.7);
      backdrop-filter: blur(12px);
      padding: 1rem 1.2rem;
      border-radius: 4rem;
      border: 1px solid rgba(0, 255, 255, 0.25);
      box-shadow: 0 10px 25px -10px rgba(0, 255, 255, 0.3);
      margin-bottom: 0.4rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 0, 255, 0.4);
      color: #f0f0ff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      letter-spacing: 0.4px;
      transition: all 0.3s ease;
      background: rgba(20, 8, 30, 0.6);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 8px rgba(255, 0, 255, 0.2);
      cursor: pointer;
      min-width: 120px;
      text-align: center;
    }

    .nav-btn:hover {
      background: #1a1035;
      border-color: #00ffff;
      color: #fff;
      box-shadow: 0 0 20px #00ffffcc, 0 0 8px #ff00ff;
      transform: translateY(-2px);
    }

    h1 {
      font-size: clamp(2.2rem, 8vw, 3.4rem);
      text-align: center;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00ffff 20%, #ff00ff 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 18px #00ffffaa);
      margin: 0.2rem 0 0.8rem;
      line-height: 1.2;
    }

    .subtitle {
      text-align: center;
      color: #9bb8da;
      font-size: 1rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px dashed #3a4a5a;
      padding-bottom: 0.8rem;
    }

    .commands-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin: 0.5rem 0;
    }

    /* Cartão estilizado premium */
    .card {
      background: rgba(16, 22, 30, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 255, 255, 0.25);
      border-radius: 2rem;
      padding: 1.5rem 1.3rem;
      box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 255, 200, 0.3);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -40%;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 0, 255, 0.3) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .card:hover {
      border-color: #ff00ff;
      box-shadow: 0 0 35px #00ffff88, 0 18px 35px -10px black;
      transform: translateY(-4px);
    }

    .card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #00ffff;
      text-shadow: 0 0 12px #00ffff;
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .meaning {
      background: rgba(0, 255, 200, 0.08);
      border-left: 4px solid #ff00ff;
      padding: 0.5rem 0.9rem;
      border-radius: 0.8rem;
      font-weight: 500;
      color: #cfecff;
      font-size: 0.95rem;
      z-index: 2;
    }

    .description {
      color: #b0c7e0;
      font-size: 0.9rem;
      margin: 0.2rem 0;
      z-index: 2;
    }

    .example-box {
      background: #0b1219;
      border: 1px solid #2e4055;
      border-radius: 1.2rem;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.15);
      z-index: 2;
      position: relative;
    }

    .code-snippet {
      font-family: 'Fira Code', 'Courier New', monospace;
      background: #02080e;
      color: #b5ffb5;
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      word-break: break-word;
      border: 1px solid #2f5f6f;
      box-shadow: 0 0 15px #00ff9940;
      letter-spacing: 0.3px;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      font-weight: bold;
      padding: 0.6rem 1rem;
      border-radius: 2.5rem;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      transition: 0.25s;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(0, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      width: fit-content;
      align-self: flex-end;
      margin-top: 0.2rem;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
    }

    .copy-btn:hover {
      background: #00ffff;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 28px #00ffff;
      transform: scale(1.03);
    }

    .copy-btn.copied {
      background: #ff00ff;
      border-color: #ff00ff;
      color: #fff;
      box-shadow: 0 0 25px #ff00ff;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      padding: 1.8rem 1rem;
      border-top: 1px solid rgba(255, 0, 255, 0.3);
      background: rgba(0, 0, 0, 0.4);
      border-radius: 3rem 3rem 1rem 1rem;
    }

    .italic-slogan {
      font-style: italic;
      font-weight: 300;
      font-size: 1.4rem;
      color: #bdb7ff;
      text-shadow: 0 0 8px magenta;
      margin: 0.3rem 0;
    }

    /* Mobile otimizations */
    @media (max-width: 500px) {
      .nav-links {
        gap: 0.5rem;
        padding: 0.8rem;
      }
      .nav-btn {
        padding: 0.65rem 1rem;
        font-size: 0.8rem;
        min-width: 100px;
      }
      .card {
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Navegação refinada -->
    <div class="nav-links">
      <a href="../../../index.html" class="nav-btn">🏠 Voltar Home</a>
      <a href="../../kali.html" class="nav-btn">📂 Voltar Kali</a>
      <a href="../kali1.html" class="nav-btn">📄 Voltar Kali1</a>
      <a href="instalacaoKali.html" class="nav-btn">🔄 Recarregar guia</a>
    </div>

    <h1>⚡ COMANDOS KALI</h1>
    <div class="subtitle">✦ essencial · terminal matrix ✦</div>

    <!-- Grade de comandos -->
    <div class="commands-grid" id="commandsContainer">
      <!-- Os cartões serão inseridos via JavaScript para manter organização e copiar funcional -->
    </div>

    <!-- Rodapé assinatura obrigatória -->
    <footer>
      <p style="font-weight:200; font-size:1.3rem; letter-spacing:1px;">Pensador Sem Fronteiras</p>
      <p class="italic-slogan">Do zero ao Infinito</p>
      <p style="margin-top:0.4rem; font-size:0.7rem; color:#5f7182;">Guia baseado na conversa real · VirtualBox · Kali 2026.1 · Moçambique</p>
    </footer>
  </div>

  <script>
    (function() {
      // ----- BASE DE DADOS: Comandos Kali Linux (maioria essencial) -----
      const commands = [
        {
          cmd: "ls",
          meaning: "Listar diretórios/arquivos",
          desc: "Lista o conteúdo do diretório atual.",
          example: "ls -la"
        },
        {
          cmd: "cd",
          meaning: "Mudar de diretório",
          desc: "Navega entre pastas.",
          example: "cd /home/user"
        },
        {
          cmd: "pwd",
          meaning: "Mostrar caminho atual",
          desc: "Exibe o diretório de trabalho.",
          example: "pwd"
        },
        {
          cmd: "mkdir",
          meaning: "Criar diretório",
          desc: "Cria uma nova pasta.",
          example: "mkdir nova_pasta"
        },
        {
          cmd: "rm",
          meaning: "Remover arquivos/diretórios",
          desc: "Remove arquivos ou pastas (com -r).",
          example: "rm -rf arquivo"
        },
        {
          cmd: "cp",
          meaning: "Copiar arquivos",
          desc: "Copia arquivos ou diretórios.",
          example: "cp origem destino"
        },
        {
          cmd: "mv",
          meaning: "Mover / renomear",
          desc: "Move ou renomeia arquivos.",
          example: "mv velho novo"
        },
        {
          cmd: "cat",
          meaning: "Concatenar e exibir",
          desc: "Mostra conteúdo de arquivo.",
          example: "cat /etc/passwd"
        },
        {
          cmd: "echo",
          meaning: "Exibir mensagem",
          desc: "Imprime texto no terminal.",
          example: "echo 'Hello Kali'"
        },
        {
          cmd: "grep",
          meaning: "Filtrar padrões",
          desc: "Busca texto dentro de arquivos.",
          example: "grep 'root' /etc/passwd"
        },
        {
          cmd: "find",
          meaning: "Buscar arquivos",
          desc: "Procura arquivos no sistema.",
          example: "find / -name '*.log'"
        },
        {
          cmd: "chmod",
          meaning: "Mudar permissões",
          desc: "Altera permissões de arquivos.",
          example: "chmod +x script.sh"
        },
        {
          cmd: "chown",
          meaning: "Mudar proprietário",
          desc: "Altera dono do arquivo.",
          example: "chown user:group file"
        },
        {
          cmd: "ps",
          meaning: "Processos ativos",
          desc: "Lista processos em execução.",
          example: "ps aux"
        },
        {
          cmd: "kill",
          meaning: "Encerrar processo",
          desc: "Mata um processo pelo PID.",
          example: "kill -9 1234"
        },
        {
          cmd: "top",
          meaning: "Monitor de recursos",
          desc: "Visualização dinâmica de processos.",
          example: "top"
        },
        {
          cmd: "df",
          meaning: "Espaço em disco",
          desc: "Uso do sistema de arquivos.",
          example: "df -h"
        },
        {
          cmd: "du",
          meaning: "Uso de diretório",
          desc: "Tamanho de pastas/arquivos.",
          example: "du -sh *"
        },
        {
          cmd: "ifconfig",
          meaning: "Configuração de rede",
          desc: "Exibe interfaces de rede (ou ip a).",
          example: "ifconfig eth0"
        },
        {
          cmd: "ping",
          meaning: "Testar conectividade",
          desc: "Envia pacotes ICMP.",
          example: "ping -c 4 8.8.8.8"
        },
        {
          cmd: "wget",
          meaning: "Download via terminal",
          desc: "Baixa arquivos da web.",
          example: "wget https://exemplo.com"
        },
        {
          cmd: "curl",
          meaning: "Transferência de dados",
          desc: "Ferramenta para URLs/APIs.",
          example: "curl -I https://kali.org"
        },
        {
          cmd: "tar",
          meaning: "Compactar/extrair",
          desc: "Arquivos .tar.gz etc.",
          example: "tar -xzf arquivo.tar.gz"
        },
        {
          cmd: "uname",
          meaning: "Informações do sistema",
          desc: "Kernel e arquitetura.",
          example: "uname -a"
        },
        {
          cmd: "whoami",
          meaning: "Usuário atual",
          desc: "Mostra o nome do usuário.",
          example: "whoami"
        },
        {
          cmd: "sudo",
          meaning: "Super usuário",
          desc: "Executa comando como root.",
          example: "sudo apt update"
        },
        {
          cmd: "apt",
          meaning: "Gerenciador de pacotes",
          desc: "Instala/remove programas.",
          example: "apt install nmap"
        },
        {
          cmd: "nmap",
          meaning: "Scanner de rede",
          desc: "Mapeamento de portas/hosts.",
          example: "nmap -sV 192.168.1.1"
        },
        {
          cmd: "man",
          meaning: "Manual do comando",
          desc: "Ajuda detalhada.",
          example: "man ls"
        },
        {
          cmd: "history",
          meaning: "Histórico de comandos",
          desc: "Lista comandos anteriores.",
          example: "history | tail"
        },
        {
          cmd: "clear",
          meaning: "Limpar tela",
          desc: "Limpa o terminal.",
          example: "clear"
        }
      ];

      const container = document.getElementById('commandsContainer');

      function buildCards() {
        container.innerHTML = '';
        commands.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          // Estrutura do cartão
          card.innerHTML = `
            <h2>⊳ ${escapeHTML(item.cmd)}</h2>
            <div class="meaning">🔹 ${escapeHTML(item.meaning)}</div>
            <div class="description">${escapeHTML(item.desc)}</div>
            <div class="example-box">
              <div class="code-snippet">$ ${escapeHTML(item.example)}</div>
              <button class="copy-btn" data-code="${escapeHTML(item.example)}">📋 Copiar</button>
            </div>
          `;

          container.appendChild(card);
        });

        // Adiciona eventos de clique para botões copiar
        document.querySelectorAll('.copy-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            const codeToCopy = this.getAttribute('data-code');
            if (!codeToCopy) return;

            navigator.clipboard.writeText(codeToCopy).then(() => {
              // Feedback visual
              this.classList.add('copied');
              this.innerHTML = '✅ Copiado!';
              setTimeout(() => {
                this.classList.remove('copied');
                this.innerHTML = '📋 Copiar';
              }, 1800);
            }).catch(err => {
              alert('Falha ao copiar. Tente novamente.');
              console.error(err);
            });
          });
        });
      }

      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Inicializa a construção dos cartões
      buildCards();
    })();
  </script>
</body>
</html>
